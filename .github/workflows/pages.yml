name: Deploy CV site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write site configuration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          set -eu
          if [ -z "${GEMINI_API_KEY}" ]; then
            echo "::warning::GEMINI_API_KEY is not set; deploying with AI comparison unavailable."
          fi
          model="${GEMINI_MODEL:-gemini-flash-latest}"
          key_json="$(printf '%s' "${GEMINI_API_KEY}" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')"
          model_json="$(printf '%s' "${model}" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')"
          {
            printf 'export const config = {\n'
            printf '  apiKey: %s,\n' "${key_json}"
            printf '  model: %s\n' "${model_json}"
            printf '};\n'
            printf 'export default config;\n'
          } > scripts/config.js

      - name: Prepare site artifact
        run: |
          set -eu
          mkdir -p _site
          cp -R index.html styles scripts images assets ResumeJPSM.pdf _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
